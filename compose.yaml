services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pennywise
      POSTGRES_USER: ${POSTGRES_USER:-pennywise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_USER: ${POSTGRES_USER:-pennywise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PENNYWISE_JWT_SECRET: ${PENNYWISE_JWT_SECRET:?Set PENNYWISE_JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres_data:
